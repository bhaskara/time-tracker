[project]
name = "timetracker"
version = "0.1.0"
description = "Low-friction daily time tracker with work, break and distraction sessions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["tzdata"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timetracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
