[project]
name = "timetracker"
version = "0.1.0"
description = "Low-friction daily time tracker with work, break and distraction sessions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "tzdata",
    "uvicorn>=0.54.0",
]

[project.scripts]
tt = "timetracker.cli.main:main"
tt-server = "timetracker.server:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timetracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
